name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notestack:backend
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notestack:frontend
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/notestack:backend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/notestack:frontend

            # Stop and remove old containers
            docker stop notestack-backend || true
            docker rm notestack-backend || true
            docker stop notestack-frontend || true
            docker rm notestack-frontend || true

            # Start backend
            docker run -d --name notestack-backend \
              -p 5000:5000 \
              --env-file /home/ubuntu/NoteStack/backend/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/notestack:backend

            # Start frontend
            docker run -d --name notestack-frontend \
              -p 8080:80 \
              --env-file /home/ubuntu/NoteStack/frontend/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/notestack:frontend
